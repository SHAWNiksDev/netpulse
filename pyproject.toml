[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpulse"
dynamic = ["version"]
description = "Async TUI dashboard that watches hosts over TCP and HTTP probes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "SHAWNiksDev" }]
keywords = ["tui", "network", "monitoring", "textual", "dashboard", "asyncio"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "textual>=7,<9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
tools = [
    "cairosvg>=2.7",
    "Pillow>=10",
]

[project.scripts]
netpulse = "netpulse.cli:main"

[project.urls]
Homepage = "https://github.com/SHAWNiksDev/netpulse"
Issues = "https://github.com/SHAWNiksDev/netpulse/issues"

[tool.hatch.version]
path = "src/netpulse/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/netpulse"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×", "●", "▲", "○", "—"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
